name: CI
on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate Env.tsx
        env:
          COURIER_BRAND_ID: ${{ secrets.COURIER_BRAND_ID }}
          COURIER_AUTH_KEY: ${{ secrets.COURIER_AUTH_KEY }}
          COURIER_CLIENT_KEY: ${{ secrets.COURIER_CLIENT_KEY }}
          # Same secret names as the other mobile SDKs. COURIER_TOPIC_ID is the old name.
          COURIER_TOPIC_ID: ${{ secrets.COURIER_PREFERENCE_TOPIC_ID || secrets.COURIER_TOPIC_ID }}
        run: |
          printf "export default class Env {\n  static readonly brandId = '%s';\n  static readonly authKey = '%s';\n  static readonly clientKey = '%s';\n  static readonly topicId = '%s';\n}\n" "$COURIER_BRAND_ID" "$COURIER_AUTH_KEY" "$COURIER_CLIENT_KEY" "$COURIER_TOPIC_ID" > example-085/src/Env.tsx
          npx prettier --write example-085/src/Env.tsx

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate Env.tsx
        env:
          COURIER_BRAND_ID: ${{ secrets.COURIER_BRAND_ID }}
          COURIER_AUTH_KEY: ${{ secrets.COURIER_AUTH_KEY }}
          COURIER_CLIENT_KEY: ${{ secrets.COURIER_CLIENT_KEY }}
          # Same secret names as the other mobile SDKs. COURIER_TOPIC_ID is the old name.
          COURIER_TOPIC_ID: ${{ secrets.COURIER_PREFERENCE_TOPIC_ID || secrets.COURIER_TOPIC_ID }}
        run: |
          printf "export default class Env {\n  static readonly brandId = '%s';\n  static readonly authKey = '%s';\n  static readonly clientKey = '%s';\n  static readonly topicId = '%s';\n}\n" "$COURIER_BRAND_ID" "$COURIER_AUTH_KEY" "$COURIER_CLIENT_KEY" "$COURIER_TOPIC_ID" > example-085/src/Env.tsx

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepack


  # Compiles the library's Kotlin (android/) and the example app against the courier-android
  # version pinned in android/build.gradle, so a bump that breaks the bridge fails here.
  # Build-only: no secrets, no signing.
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: build-android-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build example app
        working-directory: example-085/android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

  # Compiles the library's Swift (ios/) against the Courier_iOS version pinned in
  # courier-react-native.podspec. Nothing else in CI builds iOS, so a Courier_iOS bump that breaks
  # the Swift bridge would otherwise pass. Built on the current Xcode and on the oldest one
  # courier-ios still builds on. Build-only: no secrets, no signing.
  build-ios:
    name: build-ios (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: '26.6'
          - runner: macos-15
            xcode: '16.4'
    concurrency:
      group: build-ios-${{ matrix.xcode }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      LANG: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: example-085

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('example-085/ios/Podfile.lock', 'courier-react-native.podspec') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # `pod update Courier_iOS` rather than `pod install`: bump PRs change the podspec pin without
      # touching example-085/ios/Podfile.lock, and install would refuse the stale lock.
      - name: Install pods
        working-directory: example-085/ios
        run: bundle exec pod update Courier_iOS

      - name: Check resolved Courier_iOS matches the podspec pin
        run: |
          PINNED=$(sed -nE 's/.*s\.dependency "Courier_iOS", "([^"]+)".*/\1/p' courier-react-native.podspec)
          RESOLVED=$(sed -nE 's/^  - Courier_iOS \(([^)]+)\)$/\1/p' example-085/ios/Podfile.lock)
          echo "Pinned: $PINNED  Resolved: $RESOLVED"
          [ -n "$PINNED" ] && [ "$PINNED" = "$RESOLVED" ]

      # ARCHS=arm64 keeps the generic simulator destination from also building x86_64.
      - name: Build example app for iOS Simulator
        working-directory: example-085/ios
        run: |
          xcodebuild build \
            -workspace CourierReactNativeExample.xcworkspace \
            -scheme CourierReactNativeExample \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
