name: CI
on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate Env.tsx
        env:
          COURIER_BRAND_ID: ${{ secrets.COURIER_BRAND_ID }}
          COURIER_AUTH_KEY: ${{ secrets.COURIER_AUTH_KEY }}
          COURIER_CLIENT_KEY: ${{ secrets.COURIER_CLIENT_KEY }}
          # Same secret names as the other mobile SDKs. COURIER_TOPIC_ID is the old name.
          COURIER_TOPIC_ID: ${{ secrets.COURIER_PREFERENCE_TOPIC_ID || secrets.COURIER_TOPIC_ID }}
        run: |
          printf "export default class Env {\n  static readonly brandId = '%s';\n  static readonly authKey = '%s';\n  static readonly clientKey = '%s';\n  static readonly topicId = '%s';\n}\n" "$COURIER_BRAND_ID" "$COURIER_AUTH_KEY" "$COURIER_CLIENT_KEY" "$COURIER_TOPIC_ID" > example-085/src/Env.tsx
          npx prettier --write example-085/src/Env.tsx

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate Env.tsx
        env:
          COURIER_BRAND_ID: ${{ secrets.COURIER_BRAND_ID }}
          COURIER_AUTH_KEY: ${{ secrets.COURIER_AUTH_KEY }}
          COURIER_CLIENT_KEY: ${{ secrets.COURIER_CLIENT_KEY }}
          # Same secret names as the other mobile SDKs. COURIER_TOPIC_ID is the old name.
          COURIER_TOPIC_ID: ${{ secrets.COURIER_PREFERENCE_TOPIC_ID || secrets.COURIER_TOPIC_ID }}
        run: |
          printf "export default class Env {\n  static readonly brandId = '%s';\n  static readonly authKey = '%s';\n  static readonly clientKey = '%s';\n  static readonly topicId = '%s';\n}\n" "$COURIER_BRAND_ID" "$COURIER_AUTH_KEY" "$COURIER_CLIENT_KEY" "$COURIER_TOPIC_ID" > example-085/src/Env.tsx

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepack


  # Compiles the library's Kotlin (android/) and the example app against the courier-android
  # version pinned in android/build.gradle, so a bump that breaks the bridge fails here.
  # Build-only: no secrets, no signing.
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: build-android-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build example app
        working-directory: example-085/android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

  # Compiles the library's Swift (ios/) against the Courier_iOS version pinned in
  # courier-react-native.podspec. Nothing else in CI builds iOS, so a Courier_iOS bump that breaks
  # the Swift bridge would otherwise pass. Build-only: no secrets, no signing.
  build-ios-xcode:
    name: build-ios (Xcode ${{ matrix.xcode }}${{ matrix.frameworks && ', static frameworks' || '' }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Xcode 26 only: on Xcode 16, Courier_iOS from spm_dependency links twice into React
      # Native's static pod libraries (duplicate symbols). The App Store has required Xcode 26
      # since April 28, 2026.
      # Static frameworks too: apps using @react-native-firebase need use_frameworks!, and the pod's
      # headers resolve differently there.
      matrix:
        include:
          - runner: macos-26
            xcode: '26.6'
            frameworks: ''
          - runner: macos-26
            xcode: '26.6'
            frameworks: static
    concurrency:
      group: build-ios-${{ matrix.xcode }}-${{ matrix.frameworks }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      LANG: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: example-085

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ matrix.frameworks }}-${{ hashFiles('example-085/ios/Podfile.lock', 'courier-react-native.podspec') }}
          restore-keys: |
            ${{ runner.os }}-pods-${{ matrix.frameworks }}-

      # React Native 0.75+ resolves Courier_iOS through Swift Package Manager (spm_dependency in
      # the podspec), so it isn't a pod and Podfile.lock doesn't record it.
      # USE_FRAMEWORKS is only set for the static entry: the Podfile treats an empty value as a linkage.
      - name: Install pods
        working-directory: example-085/ios
        run: ${{ matrix.frameworks && format('USE_FRAMEWORKS={0} ', matrix.frameworks) || '' }}bundle exec pod install

      - name: Check Courier_iOS isn't installed from CocoaPods
        run: |
          if grep -q "Courier_iOS" example-085/ios/Podfile.lock; then
            echo "::error::Podfile.lock still lists Courier_iOS; the podspec fell back to CocoaPods trunk"
            exit 1
          fi

      # ARCHS=arm64 keeps the generic simulator destination from also building x86_64. The static
      # frameworks entry builds Release, because React Native's own Debug symbols don't link with
      # static frameworks, and SKIP_BUNDLING leaves the JS bundle out.
      - name: Build example app for iOS Simulator
        working-directory: example-085/ios
        env:
          SKIP_BUNDLING: 1
        run: |
          xcodebuild build \
            -workspace CourierReactNativeExample.xcworkspace \
            -scheme CourierReactNativeExample \
            -configuration ${{ matrix.frameworks && 'Release' || 'Debug' }} \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      # ios/Package.swift (React Native's SwiftPM mode) pins courier-ios separately
      - name: Check the Package.swift pin matches the podspec
        run: |
          PODSPEC=$(sed -nE 's/.*courier_ios_version = "([^"]+)".*/\1/p' courier-react-native.podspec)
          PACKAGE=$(sed -nE 's/.*courier-ios", exact: "([^"]+)".*/\1/p' ios/Package.swift)
          echo "podspec: $PODSPEC  Package.swift: $PACKAGE"
          [ -n "$PODSPEC" ] && [ "$PODSPEC" = "$PACKAGE" ]

      - name: Check resolved Courier_iOS matches the podspec pin
        run: |
          PINNED=$(sed -nE 's/.*courier_ios_version = "([^"]+)".*/\1/p' courier-react-native.podspec)
          RESOLVED=$(python3 -c "import json; pins=json.load(open('example-085/ios/CourierReactNativeExample.xcworkspace/xcshareddata/swiftpm/Package.resolved'))['pins']; print(next(p['state']['version'] for p in pins if p['identity'] == 'courier-ios'))")
          echo "Pinned: $PINNED  Resolved: $RESOLVED"
          [ -n "$PINNED" ] && [ "$PINNED" = "$RESOLVED" ]

  # Builds a new app in React Native's Swift Package Manager mode (0.87+), which uses the package's
  # own ios/Package.swift instead of the podspec. No CocoaPods. The template's lint and test
  # devDependencies are dropped first: they aren't needed to build, and a broken one shouldn't
  # fail this job.
  build-ios-swiftpm:
    name: build-ios (SwiftPM mode)
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: build-ios-swiftpm-${{ github.ref }}
      cancel-in-progress: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      LANG: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Pack the library
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Create an app in SwiftPM mode
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes @react-native-community/cli@latest init SpmApp --version 0.88.1 --skip-git-init --skip-install
          cd SpmApp
          node -e "const p=require('./package.json');for(const k of Object.keys(p.devDependencies||{}))if(/eslint|prettier|jest|typescript|^@types\//.test(k))delete p.devDependencies[k];require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install
          npm install "$RUNNER_TEMP"/trycourier-courier-react-native-*.tgz
          npx react-native spm add --deintegrate --yes | tee spm.log
          grep -q "Self-managed: CourierReactNative" spm.log

      - name: Build the app for iOS Simulator
        working-directory: ${{ runner.temp }}/SpmApp/ios
        run: |
          xcodebuild build \
            -project SpmApp.xcodeproj \
            -scheme SpmApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

  # The main branch ruleset requires a check named build-ios. It passes only when the CocoaPods
  # and SwiftPM builds passed. always() keeps it from being skipped, since a skipped check counts as passed.
  build-ios:
    needs: [build-ios-xcode, build-ios-swiftpm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the CocoaPods and SwiftPM builds
        run: '[ "${{ needs.build-ios-xcode.result }}" = "success" ] && [ "${{ needs.build-ios-swiftpm.result }}" = "success" ]'
